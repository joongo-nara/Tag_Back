version: '3.8'
services:
  # 서비스 이름 (내 마음대로 정할 수 있음)
  tag-db:
    image: mysql:8.0
    container_name: mysql-container
    # 내 컴퓨터 포트 : 컨테이너 내부 포트
    ports:
      - "3307:3306"
    environment:
      # 초기 데이터베이스 이름 (tagErd 기반)
      MYSQL_DATABASE: tag_db
      # 루트 계정 비밀번호
      MYSQL_ROOT_PASSWORD: root_password
      # 일반 사용자 계정 생성
      MYSQL_USER: tag_user
      MYSQL_PASSWORD: tag_password
    volumes:
      # 컨테이너가 삭제되어도 데이터가 사라지지 않게 내 컴퓨터에 저장하는 설정
      - ./mysql_data:/var/lib/mysql
    networks:
      - tag-network

networks:
  tag-network:
    driver: bridge